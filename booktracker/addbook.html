<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Book Tracker</title>
        <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/checkout/">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!--Reference CSS Doc - https://getbootstrap.com/docs/3.4/css/-->
    </head>
    </html>
    <body class = "bg-body-tertiary">
        <h1 class="mb-3 me-4 bd-mode-toggle display-5 fw-bold text-center text-body-emphasis">Add New Book</h1>
        <div class = "container-fluid row g-5 px-4 my-5 text-left">
            <form class="needs-validation" id = "AddBookForm">
                <div class = "col-12">
                    <div class = "col-12">
                        <label for = "year" class="form-label">Year</label>
                        <input type="text" id = "year" class= "form-control" placeholder="2100..." required>
                    </div>
                    <br>
                    <div class = "col-12">
                    <label for="title" class="form-label">Book Title</label>
                    <input type="text" id = "title" placeholder= "The Catcher in the Rye..." class= "form-control">
                    </div>
                    <br>
                    <div class="row g-5">
                        <!-- <div class = "order-md-last">-->
                             <div class="col-md-12">
                                 <label for="author" class="form-label">Choose Author</label>
                                 <select class="form-select" id="author">
                                     <option id="items"></option>
                                 </select>
                               </div>
                               <br>
                     </div>
                     <br>
                    <div class = "col-12">
                        <label for = "newauthor" class="form-label">Author</label>
                        <input type = "text" id = "newauthor" placeholder="Add Author Name Here if First-time Read Author..." class= "form-control">
                    </div>
                    <br>
                    <div class = "col-12">
                    <label for="genre" class="form-label">Genre</label>
                    <select class="form-select" id="genre" name="genre">
                        <option value="Fiction: Comics">Fiction: Comics</option>
                        <option value="Fiction: Fantasy">Fiction: Fantasy</option>
                        <option value="Fiction: Magical Realism">Fiction: Magical Realism</option>
                        <option value="Fiction: Mystery">Fiction: Mystery</option>
                        <option value="Fiction: Romance">Fiction: Romance</option>
                        <option value="Fiction: Sci-Fi">Fiction: Sci-Fi</option>
                        <option value="Fiction: Others">Fiction: Others</option>
                        <option value="Non-Fiction: Biography">Non-Fiction: Biography</option>
                        <option value="Non-Fiction: Business/Tech">Non-Fiction: Business/Tech</option>
                        <option value="Non-Fiction: History">Non-Fiction: History</option>
                        <option value="Non-Fiction: Self-help">Non-Fiction: Self-help</option>
                        <option value="Non-Fiction: Others">Non-Fiction: Others</option>
                        <option value="Non-Fiction: Science">Non-Fiction: Science</option>
                    </select>
                    </div>
                    <br>
                    <div class = "col-12">
                        <label for="format" class="form-label">Format</label>
                        <select class="form-select" id="format" name="format">
                            <option value="Hard Copy">Hard Copy</option>
                            <option value="eBook (Kindle, PDF, Apple books)">eBook (Kindle, PDF, Apple books)</option>
                            <option value="Audiobook">Audiobook</option>
                        </select>
                        </div>
                        <br>
                    <div class = "col-12">
                        <label for = "rating" class="form-label">My Rating</label>
                        <input type = "number" id = "rating" placeholder="5..." class= "form-control">
                    </div>
                </div>
            </form>
            <div class = "card p-0">
                <button type="submit" class="w-100 btn btn-primary btn-lg"  id = "enterbtn" onclick = writeGoogleSheet()>Enter</button>
            </div>
            <div class = "col-12">
                <p id="outmsg" class= "text-body-secondary text-center"></p>
            </div> 
            
            
        </div>
        <script src="booktracker.js" type="text/javascript"></script>
    </body>
</html>
